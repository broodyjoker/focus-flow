# =============================================================================
# windows.yml — Build a Windows installer (.exe / .msi) with Tauri
#
# Trigger: push to main, or manually via Actions → "Run workflow"
#
# Steps:
#   1. Check out code
#   2. Set up Node & Rust toolchains
#   3. Install npm dependencies
#   4. Use the official Tauri GitHub Action to build the Windows installer
#   5. Upload the installer as a workflow artifact
#
# FIRST-TIME SETUP:
#   Before this workflow runs you must have:
#     a) Installed Tauri CLI: npm install --save-dev @tauri-apps/cli
#     b) Initialised Tauri:   npx tauri init
#        (point "distDir" to "../dist" and "devUrl" to http://localhost:5173)
#     c) Committed the `src-tauri/` folder to your repo
#
# NOTE ON SIGNING:
#   The Tauri Action can sign the installer automatically if you add the
#   following secrets to your repo (Settings → Secrets):
#     TAURI_SIGNING_PRIVATE_KEY      – your private key
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD – the key password (can be empty)
#   Without these secrets the build succeeds but the installer is unsigned.
# =============================================================================

name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:   # Allow manual trigger from the Actions UI

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      # ── 1. Check out the repository ────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ──────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Set up Rust (required by Tauri's Rust backend) ─────────────────
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ── 4. Cache Rust build artifacts ─────────────────────────────────────
      # Caching ~/.cargo and target/ dramatically speeds up subsequent runs.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── 5. Install npm dependencies ────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 6. Build with Tauri ────────────────────────────────────────────────
      # The official action handles: npm run build (Vite), then cargo build
      # (Tauri), then packaging into a .msi / NSIS .exe installer.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Remove these two lines if you do not have signing secrets set up yet:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── 7. Upload installer artifact ───────────────────────────────────────
      # The installer is placed in src-tauri/target/release/bundle/
      # The glob below captures both .msi and NSIS .exe formats.
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: focus-flow-windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
